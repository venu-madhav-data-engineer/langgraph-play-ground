[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-core"
version = "0.1.0"
description = "Shared core utilities, state schemas, and graph builders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
