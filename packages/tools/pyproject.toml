[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-tools"
version = "0.1.0"
description = "Shared tools for LangGraph agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
